name: bomba.lt E2E (Production Monitor)

# Paleidžia full 6-agent QA suite prieš produkciją https://bomba.lt
#
# MODE: TIK read-only — JOKIO checkout, JOKIO actual order submission.
#
# Trigger'iai (po 2026-05-25 billing minimization v2):
#   - push į master/main — TIK 4 core suites × 1 platform (~4 jobs)
#   - pull_request — TIK smoke × 1 platform (~1 job) sanity check
#   - weekly schedule (pirmadienis 06:00 UTC) — 3 jobs drift detection
#   - manual workflow_dispatch — pilna matrica kai reikia (qa_suite=all)
#
# Minutes biudžetas (free tier 2000 min/mėn private repo):
#   - push run: 4 jobs × ~3 min = ~12 min
#   - PR run: 1 job × ~3 min = ~3 min
#   - weekly: 3 jobs × ~3 min = ~9 min/sav = ~36 min/mėn
#   - manual full: 11 jobs × ~3 min = ~33 min
#   → typical mėn: <200 min, gerai telpa į free tier

on:
  push:
    branches: [master, main]
    paths:
      - 'tests/**'
      - 'playwright.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'tests/**'
      - 'playwright.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  schedule:
    # Buvo daily '0 6 * * *' (12 jobs × 7 = ~84 jobs/sav). Sumažinta į weekly Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      qa_suite:
        description: 'QA dimension'
        type: choice
        default: all
        options:
          - all
          - smoke
          - a11y
          - security
          - mobile
          - performance
          - checkout
          - visual

concurrency:
  group: bomba-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.suite }} on ${{ matrix.project }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        suite:
          - smoke
          - a11y
          - security
          - mobile
          - performance
          - checkout
        project:
          - desktop-chromium
          - mobile-iphone
        exclude:
          # Mobile suite TIK ant mobile project
          - suite: mobile
            project: desktop-chromium

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install browser deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Event-aware trim — billing minimization (v2 2026-05-25)
        id: trim
        run: |
          EVENT="${{ github.event_name }}"
          SUITE="${{ matrix.suite }}"
          PROJECT="${{ matrix.project }}"

          case "$EVENT" in
            schedule)
              # Weekly drift run: TIK smoke+security+a11y ant desktop-chromium (3 jobs)
              if [ "$PROJECT" = "desktop-chromium" ] && [[ "|smoke|security|a11y|" == *"|$SUITE|"* ]]; then
                echo "run=true" >> $GITHUB_OUTPUT
              else
                echo "run=false" >> $GITHUB_OUTPUT
                echo "::notice::Skip ($EVENT): $SUITE/$PROJECT"
              fi
              ;;
            pull_request)
              # PR sanity check: TIK smoke × desktop-chromium (1 job)
              if [ "$PROJECT" = "desktop-chromium" ] && [ "$SUITE" = "smoke" ]; then
                echo "run=true" >> $GITHUB_OUTPUT
              else
                echo "run=false" >> $GITHUB_OUTPUT
                echo "::notice::Skip ($EVENT): $SUITE/$PROJECT — PR runs only smoke/desktop"
              fi
              ;;
            push)
              # Push: 4 core suites × desktop-chromium (4 jobs)
              # mobile-iphone testuojama TIK manual arba weekly
              if [ "$PROJECT" = "desktop-chromium" ] && \
                 [[ "|smoke|security|a11y|checkout|" == *"|$SUITE|"* ]]; then
                echo "run=true" >> $GITHUB_OUTPUT
              else
                echo "run=false" >> $GITHUB_OUTPUT
                echo "::notice::Skip ($EVENT): $SUITE/$PROJECT — push runs only 4 core/desktop"
              fi
              ;;
            *)
              # workflow_dispatch arba bet kas kitas — pilna matrica
              echo "run=true" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Selected suite filter
        id: filter
        if: steps.trim.outputs.run == 'true'
        run: |
          INPUT="${{ inputs.qa_suite }}"
          MATRIX="${{ matrix.suite }}"
          if [ "$INPUT" = "all" ] || [ -z "$INPUT" ] || [ "$INPUT" = "$MATRIX" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Playwright (${{ matrix.suite }})
        if: steps.trim.outputs.run == 'true' && steps.filter.outputs.run == 'true'
        env:
          CI: 'true'
          BASE_URL: 'https://bomba.lt'
        run: npx playwright test specs/${{ matrix.suite }} --project=${{ matrix.project }}

      - name: Upload HTML report
        if: always() && steps.trim.outputs.run == 'true' && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.suite }}-${{ matrix.project }}
          path: playwright-report
          retention-days: 30

      - name: Upload traces (failures)
        if: failure() && steps.trim.outputs.run == 'true' && steps.filter.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.suite }}-${{ matrix.project }}
          path: test-results/**/trace.zip
          retention-days: 7

  visual-baseline:
    name: Visual regression baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && (inputs.qa_suite == 'visual' || inputs.qa_suite == 'all')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run visual tests
        env:
          CI: 'true'
        run: npx playwright test specs/visual

      - name: Upload visual diffs (on update)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: visual-screenshots
          path: |
            tests/e2e/specs/visual/__screenshots__
            test-results/**/*.png
          retention-days: 30

  summary:
    name: QA Suite Summary
    runs-on: ubuntu-22.04
    needs: [e2e]
    if: always()
    steps:
      - name: Report
        run: |
          echo "## bomba.lt 6-Agent QA Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Dimension | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Overall E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Target: https://bomba.lt" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.e2e.result }}" != "success" ]; then
            exit 1
          fi
